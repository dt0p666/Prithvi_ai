<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="prithviGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3cc" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#664610" />
    </linearGradient>

    <linearGradient id="prithviTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e27a5b" />
      <stop offset="60%" stop-color="#b85233" />
      <stop offset="100%" stop-color="#6e2b17" />
    </linearGradient>

    <linearGradient id="prithviEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58d68d" />
      <stop offset="70%" stop-color="#1e6b37" />
      <stop offset="100%" stop-color="#0b3117" />
    </linearGradient>

    <radialGradient id="earthDisc" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2e2217" />
      <stop offset="55%" stop-color="#18110b" />
      <stop offset="100%" stop-color="#0b0805" />
    </radialGradient>
  </defs>

  <!-- Outer Planetary Boundary Ring -->
  <circle cx="50" cy="50" r="47" fill="url(#earthDisc)" stroke="url(#prithviGold)" stroke-width="1.8" />

  <!-- 8 Cardinal Points (Ashta-Dikpalas compass markings) -->
  <circle cx="94" cy="50" r="1.6" fill="#f7e7b4" />
  <circle cx="81.1" cy="81.1" r="1.0" fill="#aa771c" />
  <circle cx="50" cy="94" r="1.6" fill="#f7e7b4" />
  <circle cx="18.9" cy="81.1" r="1.0" fill="#aa771c" />
  <circle cx="6" cy="50" r="1.6" fill="#f7e7b4" />
  <circle cx="18.9" cy="18.9" r="1.0" fill="#aa771c" />
  <circle cx="50" cy="6" r="1.6" fill="#f7e7b4" />
  <circle cx="81.1" cy="18.9" r="1.0" fill="#aa771c" />

  <!-- Gyroscopic Coordinate Rings -->
  <ellipse cx="50" cy="50" rx="41" ry="18" fill="none" stroke="url(#prithviGold)" stroke-width="0.9" stroke-dasharray="2.5 3" opacity="0.75" transform="rotate(25 50 50)" />
  <ellipse cx="50" cy="50" rx="18" ry="41" fill="none" stroke="url(#prithviTerracotta)" stroke-width="0.9" stroke-dasharray="3 3.5" opacity="0.8" transform="rotate(-30 50 50)" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#prithviEmerald)" stroke-width="1.2" opacity="0.7" />

  <!-- Central Sanskrit 'पृ' & Serif 'P' Motif -->
  <path d="M 37 28 L 52 28 C 63 28, 69 34, 69 42 C 69 50, 62 55, 52 55 L 45 55 L 45 68 L 37 68 Z M 45 35 L 45 48 L 51 48 C 57 48, 61 46, 61 41.5 C 61 37, 57 35, 51 35 Z" fill="url(#prithviGold)" />
  <path d="M 45 68 C 45 74, 51 77, 57 75 C 60 74, 62 71, 62 69 C 62 67, 60 67, 59 68 C 58 69, 56 70, 54 70 C 50 70, 48 67, 48 64 Z" fill="url(#prithviEmerald)" />
  <circle cx="50" cy="41.5" r="2.2" fill="#fff3cc" />
</svg>
